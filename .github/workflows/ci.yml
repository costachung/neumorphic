name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Print toolchain
        run: swift --version

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              # Tag pushes always report an all-zero "before". Compare against the
              # previous tag instead, falling back to the root commit for the first one.
              base_sha="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null \
                || git rev-list --max-parents=0 HEAD)"
            fi
          fi
          git diff --check "$base_sha" "${{ github.sha }}"

      - name: Lint Swift formatting
        run: swift format lint --recursive --strict Package.swift Sources Tests neumorphic-examples/Shared

      - name: Run package tests
        run: swift test --scratch-path .build/macos -Xswiftc -warnings-as-errors

      - name: Build for minimum macOS version
        run: swift build --target Neumorphic --scratch-path .build/macos-minimum --sdk "$(xcrun --sdk macosx --show-sdk-path)" --triple x86_64-apple-macosx10.15

      - name: Build for iOS
        run: swift build --scratch-path .build/ios --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios13.0

      - name: Build macOS Example
        run: >-
          xcodebuild -workspace neumorphic.xcworkspace -scheme neumorphic-example
          -destination 'platform=macOS' -derivedDataPath .build/example-macos
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build iOS Example
        run: >-
          xcodebuild -workspace neumorphic.xcworkspace -scheme neumorphic-example
          -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/example-ios
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Validate DocC catalog
        run: |
          docc_symbols_dir="${RUNNER_TEMP:?}/neumorphic-symbol-graphs"
          docc_archive_path="${RUNNER_TEMP:?}/Neumorphic.doccarchive"
          mkdir -p "$docc_symbols_dir"
          swift build --target Neumorphic --scratch-path .build/docc \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-extension-block-symbols \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc "$docc_symbols_dir"
          xcrun docc convert Sources/Neumorphic/Neumorphic.docc \
            --additional-symbol-graph-dir "$docc_symbols_dir" \
            --fallback-display-name Neumorphic \
            --fallback-bundle-identifier com.gewill.neumorphic \
            --output-path "$docc_archive_path" \
            --warnings-as-errors

      - name: Swift 6 strict concurrency check
        run: swiftc -typecheck -swift-version 6 -strict-concurrency=complete -target arm64-apple-macosx14.0 -module-name Neumorphic Sources/Neumorphic/*.swift

      - name: Diagnose API breakages
        run: |
          api_baseline="$(git describe --tags --abbrev=0 --match 'v*' HEAD^)"
          echo "Comparing API against ${api_baseline}"
          swift package diagnose-api-breaking-changes "$api_baseline" --products Neumorphic
